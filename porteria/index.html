<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Portería — Central Mantenimiento App</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23004E9E'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>"/>
<link rel="stylesheet" href="/porteria/style.css"/>
<link rel="stylesheet" href="/shared/cargando.css"/>
<script>try{var t=localStorage.getItem('porteria_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script>fetch("https://crf-central-mantenimiento-api.onrender.com/api/health",{method:"HEAD"}).catch(function(){});</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/frio-alimentario/config.js"></script>
<script>
(function(){
  var CLAVE='porteria_token', orig=window.fetch.bind(window), sb=null;
  function leer(){try{return sessionStorage.getItem(CLAVE);}catch(e){return null;}}
  function guardar(t){try{sessionStorage.setItem(CLAVE,t);}catch(e){}}
  function borrar(){try{sessionStorage.removeItem(CLAVE);}catch(e){}}
  function cliente(){
    if(!sb&&window.supabase&&window.SUPABASE_URL){
      sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
      sb.auth.onAuthStateChange(function(e,s){ if(s) guardar(s.access_token); else borrar(); });
    }
    return sb;
  }
  async function actualizar(){
    var c=cliente(); if(!c) return null;
    var r=await c.auth.getSession();
    var t=r.data.session&&r.data.session.access_token;
    if(t) guardar(t); else borrar();
    return t||null;
  }
  async function salir(){
    var c=cliente(); if(c) await c.auth.signOut();
    borrar(); location.href='/';
  }
  window.porteriaSesion={leer:leer,borrar:borrar,actualizar:actualizar,salir:salir};
  window.fetch=function(entrada,opciones){
    var url=typeof entrada==='string'?entrada:(entrada&&entrada.url)||'';
    if(url.indexOf('/api/')===-1) return orig(entrada,opciones);
    opciones=Object.assign({},opciones);
    var h=new Headers(opciones.headers||{}), t=leer();
    if(t&&!h.has('Authorization')) h.set('Authorization','Bearer '+t);
    opciones.headers=h;
    return orig(entrada,opciones).then(function(res){
      if(url.indexOf('/api/usuarios/login')!==-1){
        return res.clone().json().then(function(d){ if(d&&d.ok&&d.token) guardar(d.token); return res; }).catch(function(){return res;});
      }
      if(res.status===401){ borrar(); window.dispatchEvent(new Event('porteria:sesion-vencida')); }
      return res;
    });
  };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="/shared/acceso.js"></script>
<script defer src="/porteria/app.js"></script>
</body>
</html>
